[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite-health-ai"
version = "0.1.0"
description = "Explainable multivariate anomaly detection for spacecraft health monitoring"
requires-python = ">=3.12"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "jupyterlab",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
